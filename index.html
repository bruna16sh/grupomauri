<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grupo Mauri | Ecossistema de tecnologia, cloud e marca</title>
    <meta name="description" content="O Grupo Mauri atua em frentes especializadas: tecnologia e IA, otimização de custos em cloud (FinOps) e branding e marketing, com estratégia e visão de negócio." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              mauri: {
                black: '#0d0c07',
                white: '#ededed',
                silver: '#c7c9ce',
                red: '#920027',
              }
            },
            fontFamily: {
              fraunces: ['"Fraunces"', 'serif'],
              bodoni: ['"Bodoni Moda"', 'serif'],
              lato: ['"Lato"', 'sans-serif'],
            },
            backgroundImage: {
              'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
            }
          }
        }
      }
    </script>
    <style>
      /* ============ Tokens de profundidade (editorial tecnológico premium) ============ */
      :root {
        --bg-deep: #050504;
        --bg-primary: #0a0908;
        --bg-secondary: #0e0d0b;
        --surface-1: #131210;
        --surface-2: #181613;
        --text-primary: #f0eee8;
        --text-secondary: #b7b4ac;
        --text-muted: #86837c;
        --border-subtle: rgba(255, 255, 255, 0.07);
        --border-medium: rgba(255, 255, 255, 0.12);
        --border-strong: rgba(255, 255, 255, 0.20);
        --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
        --dur: 200ms;
      }

      html { scroll-behavior: smooth; }

      body {
        background-color: var(--bg-primary);
        color: var(--text-primary);
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      /* Título metálico (chrome discreto), refinado para mais contraste/legibilidade */
      .title-silver {
        background: linear-gradient(180deg, #ffffff 0%, #eceef1 34%, #cfd1d6 70%, #b6b8bf 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
      }

      /* Equilíbrio de quebra de linha dos títulos */
      .balance { text-wrap: balance; }

      /* Escala tipográfica fluida (moderada, não oversized) */
      .h-hero {
        font-size: clamp(2.35rem, 1.4rem + 3.4vw, 3.85rem);
        line-height: 1.07;
        letter-spacing: -0.018em;
      }
      .h-section {
        font-size: clamp(1.85rem, 1.2rem + 2.4vw, 2.95rem);
        line-height: 1.12;
        letter-spacing: -0.014em;
      }
      .measure { max-width: 68ch; }

      /* Ritmo vertical das seções (múltiplos de 8, fluido e generoso) */
      .section-y { padding-block: clamp(6rem, 4.5rem + 6vw, 9rem); }

      /* Linha estrutural que esmaece nas pontas */
      .hairline {
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--border-medium) 22%, var(--border-medium) 78%, transparent);
      }

      /* Sublinhado animado para links textuais */
      .link-underline { position: relative; }
      .link-underline::after {
        content: '';
        position: absolute;
        left: 0;
        bottom: -2px;
        width: 100%;
        height: 1px;
        background: currentColor;
        transform: scaleX(0);
        transform-origin: left;
        transition: transform var(--dur) var(--ease-out);
        opacity: 0.55;
      }
      .link-underline:hover::after,
      .link-underline:focus-visible::after { transform: scaleX(1); }

      /* Foco visível consistente e acessível */
      a:focus-visible,
      button:focus-visible {
        outline: none;
        box-shadow: 0 0 0 2px var(--bg-primary), 0 0 0 4px rgba(255, 255, 255, 0.55);
        border-radius: 2px;
      }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 9px; }
      ::-webkit-scrollbar-track { background: var(--bg-deep); }
      ::-webkit-scrollbar-thumb { background: #2a2a26; border-radius: 6px; border: 2px solid var(--bg-deep); }
      ::-webkit-scrollbar-thumb:hover { background: #3d3d38; }

      /* Redução de movimento */
      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
