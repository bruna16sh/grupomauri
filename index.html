<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grupo Mauri | Ecossistema de tecnologia, cloud e marca</title>
    <meta name="description" content="O Grupo Mauri atua em frentes especializadas: tecnologia e IA, otimização de custos em cloud (FinOps) e branding e marketing, com estratégia e visão de negócio." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              mauri: {
                black: '#0d0c07',
                white: '#ededed',
                silver: '#c7c9ce',
                red: '#920027',
              }
            },
            fontFamily: {
              fraunces: ['"Fraunces"', 'serif'],
              bodoni: ['"Bodoni Moda"', 'serif'],
              lato: ['"Lato"', 'sans-serif'],
            },
            backgroundImage: {
              'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #0d0c07;
        color: #ededed;
        overflow-x: hidden;
      }
      /* Gradiente prata metálico (efeito chrome/futurista) para títulos */
      .title-silver {
        background: linear-gradient(180deg, #ffffff 0%, #e6e7ea 38%, #b8bac0 72%, #90929a 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
      }
      /* Custom Scrollbar for a premium feel */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0d0c07;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #c7c9ce;
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
